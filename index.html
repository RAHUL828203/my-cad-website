
<h2 style="text-align:center;color:#38bdf8;">
  My 3D CAD Model
</h2>

<div id="cad-viewer" style="width:100%;height:500px;"></div>

<script type="module">
import * as THREE from 'https://esm.sh/three@0.160.0';
import { OrbitControls } from 'https://esm.sh/three@0.160.0/addons/controls/OrbitControls.js';
import { STLLoader } from 'https://esm.sh/three@0.160.0/addons/loaders/STLLoader.js';

const box = document.getElementById('cad-viewer');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b1220);

const camera = new THREE.PerspectiveCamera(45, box.clientWidth / box.clientHeight, 0.1, 10000);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(box.clientWidth, box.clientHeight);
box.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff, 0x444466, 3));

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

new STLLoader().load(
  './Plastic%20Enclosure%20with%20Snaps.STL',
  (geometry) => {
    geometry.computeVertexNormals();
    geometry.center();
    geometry.computeBoundingSphere();

    const model = new THREE.Mesh(
      geometry,
      new THREE.MeshStandardMaterial({
        color: 0x38bdf8,
        metalness: 0.25,
        roughness: 0.45,
        side: THREE.DoubleSide
      })
    );

    scene.add(model);

    const radius = geometry.boundingSphere.radius;
    camera.position.set(radius * 2, radius * 1.5, radius * 2);
    camera.near = Math.max(radius / 1000, 0.001);
    camera.far = radius * 100;
    camera.updateProjectionMatrix();
    controls.target.set(0, 0, 0);
    controls.update();
  },
  undefined,
  (error) => console.error('STL loading failed:', error)
);

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
